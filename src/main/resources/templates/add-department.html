<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Department</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-logo">

            <h2>DevTestBuildClass</h2>

            <p>Employee Portal</p>

        </div>

        <nav class="sidebar-menu">

            <a href="/dashboard" class="menu-item">
                🏠 Dashboard
            </a>

            <a href="/employees" class="menu-item">
                👥 Employees
            </a>

            <a href="/departments" class="menu-item active">
                🏢 Departments
            </a>

            <a href="/profile" class="menu-item">
                👤 My Profile
            </a>

            <a href="/login" class="menu-item logout">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <h1>Add Department</h1>

                <p>
                    Create a new department
                </p>

            </div>

        </header>


        <section class="employee-form-card">

            <div class="form-header">

                <h2>Department Information</h2>

                <p>
                    Enter department details
                </p>

            </div>


            <form
                    th:action="@{/departments/add}"
                    th:object="${department}"
                    method="post">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Department Name
                        </label>

                        <input
                                type="text"
                                id="name"
                                th:field="*{name}"
                                placeholder="Example: Engineering"
                                required>

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                                id="status"
                                th:field="*{status}"
                                required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="INACTIVE">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group full-width">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                            id="description"
                            th:field="*{description}"
                            rows="5"
                            placeholder="Enter department description">
                    </textarea>

                </div>


                <div class="form-actions">

                    <a
                            href="/departments"
                            class="cancel-button">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="save-button">
                        Save Department
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>

</html>
