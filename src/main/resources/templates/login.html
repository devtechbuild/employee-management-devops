<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management - Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">
            <h1>DevTestBuildClass</h1>
            <p>Employee Management Portal</p>
        </div>


        <!-- Login Title -->
        <div class="login-title">
            <h2>Welcome Back</h2>
            <p>Login to access the employee portal</p>
        </div>


        <!-- Login Error -->
        <div th:if="${param.error}"
             class="error-message">
            Invalid username or password
        </div>


        <!-- Logout Message -->
        <div th:if="${param.logout}"
             class="success-message">
            You have been logged out successfully.
        </div>


        <!-- Login Form -->
        <form th:action="@{/login}" method="post">

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

            </div>


            <!-- Login Button -->
            <button
                    type="submit"
                    class="login-button">

                Login

            </button>

        </form>


        <!-- Registration Link -->
        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <!-- Footer -->
        <div class="footer">

            © 2026 DevTestBuildClass

        </div>

    </div>

</div>

</body>

</html>
