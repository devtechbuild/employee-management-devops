<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-logo">

            <h2>DevTestBuildClass</h2>

            <p>Employee Portal</p>

        </div>

        <nav class="sidebar-menu">

            <a href="/dashboard" class="menu-item">
                🏠 Dashboard
            </a>

            <a href="/employees" class="menu-item active">
                👥 Employees
            </a>

            <a href="/departments" class="menu-item">
                🏢 Departments
            </a>

            <a href="/profile" class="menu-item">
                👤 My Profile
            </a>

            <a href="/login" class="menu-item logout">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <h1>Edit Employee</h1>

                <p>
                    Update employee information
                </p>

            </div>

        </header>


        <section class="employee-form-card">

            <div class="form-header">

                <h2>Employee Information</h2>

                <p>
                    Update the employee details below
                </p>

            </div>


            <form
                    th:action="@{/employees/edit/{id}(id=${employee.id})}"
                    th:object="${employee}"
                    method="post">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Employee ID</label>

                        <input
                                type="text"
                                th:field="*{employeeId}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                                type="text"
                                th:field="*{fullName}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                                type="email"
                                th:field="*{email}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                                type="tel"
                                th:field="*{phone}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Department</label>

                        <select
                                th:field="*{department}"
                                required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="Engineering">
                                Engineering
                            </option>

                            <option value="QA">
                                QA
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Operations">
                                Operations
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Role</label>

                        <input
                                type="text"
                                th:field="*{role}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Joining Date</label>

                        <input
                                type="date"
                                th:field="*{joiningDate}"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Status</label>

                        <select
                                th:field="*{status}"
                                required>

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="INACTIVE">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group full-width">

                    <label>Address</label>

                    <textarea
                            th:field="*{address}"
                            rows="4"></textarea>

                </div>


                <div class="form-actions">

                    <a
                            href="/employees"
                            class="cancel-button">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="save-button">
                        Update Employee
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>

</html>
